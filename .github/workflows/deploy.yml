name: Deploy add-in to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-published
# add-in is one that fails to load for whoever opens it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Resolves the Pages URL for this repo — project site or user site —
      # before the build, so the manifest can be stamped with it.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          ADDIN_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Prepare artifact
        run: |
          # Pages runs Jekyll otherwise, which drops files it doesn't like.
          touch dist/.nojekyll
          # The design harness is for local work; no reason to publish it.
          rm -f dist/preview.html dist/preview.js dist/preview.js.map

      - name: Verify the packaged manifest
        run: |
          echo "URLs in the published manifest:"
          grep -oE 'https://[^"<]+' dist/manifest.xml | sort -u
          if grep -q 'localhost' dist/manifest.xml; then
            echo "::error::manifest still points at localhost — it would load for nobody"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Where to point the admin center
        run: |
          echo "Manifest URL for Microsoft 365 admin center:"
          echo "  ${{ steps.deployment.outputs.page_url }}manifest.xml"
